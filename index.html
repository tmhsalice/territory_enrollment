/* =========================================================
   2. 資料來源設定
   ⚠️ 請先依 Code_拜訪統計端點.gs 的說明部署 Apps Script 網頁應用程式，
      再把取得的網址貼到下面的 GAS_JSON_URL（結尾是 /exec）。
      這個方式用你自己的帳號權限讀取試算表，不受「連結分享」設定限制，
      也不會因為學校網域政策擋掉外部連結分享而失敗。
   ========================================================= */
const GAS_JSON_URL = "https://script.google.com/macros/s/AKfycbxk7B63_UWZZjsS0sZd47QNZz2DppTSa_CXYqEIOhqdXDh6sFlaZaiU8OaNBwOLJjNy/exec";

let visitsBySchool = {}; // normalizedKey -> array of visit rows (sorted new->old)
let allVisitRecords = []; // 全部拜訪紀錄（不分學校），用來計算「督導本人出訪共X次」（含同行拜訪）

/* 姓名正規化：去除各種空白、括號註記、職稱後綴，避免「趙艷容」「趙艷容 老師」「趙艷容(校長)」被算成不同人 */
function normalizeName(n){
    return String(n || "")
        // 統一相似字形：艶(U+8276)、豔(U+8C54) → 艷(U+8277)，避免同一人因字形不同被拆成兩個人
        .replace(/[\u8276\u8c54]/g, "\u8277")
        .replace(/[（(][^）)]*[）)]/g, "")
        .replace(/[\s\u3000]+/g, "")
        .replace(/(督導|老師|校長|主任|組長)$/,"")
        .trim();
}

/* 把「同行拜訪人」欄位的字串拆成姓名陣列，相容頓號、逗號、斜線、換行等分隔方式 */
function splitNames(str){
    if(!str) return [];
    return String(str)
        .split(/[、,，\/／;；\n]+/)
        .map(s => s.trim())
        .filter(s => s && s !== "無" && s.toLowerCase() !== "none");
}

/* =========================================================
   3. 渲染區域/學校卡片（骨架，資料到齊後再填拜訪統計）
   ========================================================= */
function renderGrid(containerId, regions){
    const container = document.getElementById(containerId);
    container.innerHTML = regions.map(r => `
      <div class="card">
        <div class="region-title" onclick="toggle('${r.id}')">${r.region}</div>
        <div id="${r.id}" class="schools">
          ${r.schools.map(s => `
            <div class="line-title" id="line_${s.id}" onclick="toggleSchool(this,'${s.id}')">
              <span class="name">${s.name}</span>
              <span class="badge badge-none" id="badge_${s.id}">(尚無資料)</span>
            </div>
            <div id="${s.id}" class="teacher">
              <span class="supervisor" id="sup_${s.id}">區域督導：${s.supervisor}</span><br>
              認輔老師：${s.teachers}
              <div id="summary_${s.id}"></div>
            </div>
          `).join("")}
        </div>
      </div>
    `).join("");
}

function toggle(id){
    const el=document.getElementById(id);
    el.style.display = (el.style.display==="block") ? "none" : "block";
}
function toggleSchool(btn,id){
    const el=document.getElementById(id);
    if(!el) return;
    el.style.display = (el.style.display==="block") ? "none" : "block";
}

/* =========================================================
   4-5. 欄位比對（容錯：不要求欄名跟試算表標題列完全一致）
   從 GAS 回傳的物件鍵值（即試算表標題列文字）中，找出符合條件的實際鍵名
   ========================================================= */
function findKey(sampleKeys, mustInclude, mustExclude=[]){
    for(const k of sampleKeys){
        if(mustInclude.every(w=>k.includes(w)) && !mustExclude.some(w=>k.includes(w))){
            return k;
        }
    }
    return null;
}

/* =========================================================
   6. 學校名稱正規化（讓「北屯區軍功國小」能對上「軍功國小」）
   ========================================================= */
const REGION_NAMES = ["豐原區","潭子區","太平區","北屯區","神岡區","大雅區","西屯區","南屯區"];
const SUFFIXES = ["附設國中部","國民小學","國民中學","高級中學","工業高中","國小","國中","高中"];

function schoolLevel(raw){
    if(!raw) return "";
    if(raw.includes("國小") || raw.includes("國民小學")) return "小";
    if(/附設國中部|國中|國民中學|高中|高級中學/.test(raw)) return "中";
    return "";
}

function normalizeSchoolName(raw){
    if(!raw) return "";
    let s = raw.trim();
    REGION_NAMES.forEach(r => { s = s.split(r).join(""); });
    SUFFIXES.forEach(suf => { s = s.split(suf).join(""); });
    return s.trim();
}

/* key = 校名 + 學段(小/中)，避免「潭子國小」與「潭子國中」撞名 */
function schoolKey(raw){
    const base = normalizeSchoolName(raw);
    return base ? base + "|" + schoolLevel(raw) : "";
}

/* 建立「校名|學段 -> 學校id」對照表 */
const NAME_TO_SCHOOLID = {};
[...SCHOOL_DATA.elementary, ...SCHOOL_DATA.junior].forEach(region=>{
    region.schools.forEach(s=>{
        NAME_TO_SCHOOLID[schoolKey(s.name)] = s.id;
    });
});

function matchSchoolId(visitUnitRaw){
    const key = schoolKey(visitUnitRaw);
    if(!key) return null;
    if(NAME_TO_SCHOOLID[key]) return NAME_TO_SCHOOLID[key];
    const [base, level] = key.split("|");
    // 填寫時沒寫國小/國中：只有校名唯一時才比對
    if(!level){
        const hits = Object.keys(NAME_TO_SCHOOLID).filter(k => k.split("|")[0] === base);
        return hits.length === 1 ? NAME_TO_SCHOOLID[hits[0]] : null;
    }
    // fallback：同學段內的包含比對
    for(const k in NAME_TO_SCHOOLID){
        const [kb, kl] = k.split("|");
        if(kl === level && kb && (base.includes(kb) || kb.includes(base))) return NAME_TO_SCHOOLID[k];
    }
    return null;
}

/* =========================================================
   7. 載入並套用試算表資料
   ========================================================= */
async function loadVisitData(){
    const statusBar = document.getElementById("statusBar");
    statusBar.innerHTML = `資料載入中… <button onclick="loadVisitData()">重新整理</button>`;

    if(!GAS_JSON_URL || GAS_JSON_URL.startsWith("請貼上")){
        statusBar.innerHTML =
            `<span class="status-error">尚未設定資料來源網址，請先部署 Code_拜訪統計端點.gs 並把網址填入 GAS_JSON_URL</span>`;
        return;
    }

    try{
        const res = await fetch(GAS_JSON_URL, {cache:"no-store"});
        if(!res.ok) throw new Error("HTTP " + res.status);
        const json = await res.json();
        if(json && json.error) throw new Error(json.error);
        if(!Array.isArray(json)) throw new Error("回傳格式不是陣列，請確認 Apps Script 部署設定");
        if(json.length === 0) throw new Error("試算表沒有資料列");

        const sampleKeys = Object.keys(json[0]);
        const key = {
            reporter: findKey(sampleKeys, ["填報人"], ["編"]),
            companions: findKey(sampleKeys, ["同行拜訪"]),
            unit:     findKey(sampleKeys, ["拜訪單位"]),
            reason:   findKey(sampleKeys, ["拜訪事由"]),
            hasOpp:   findKey(sampleKeys, ["是否","招生機會"]),
            oppDesc:  findKey(sampleKeys, ["招生機會","簡述"]),
            help:     findKey(sampleKeys, ["希望","協助"]),
            note:     findKey(sampleKeys, ["拜訪記事"]),
            date:     findKey(sampleKeys, ["拜訪日期"]),
            aiSummary: findKey(sampleKeys, ["AI","統整摘要"]),
            strategy: findKey(sampleKeys, ["招生策略"])
        };
        if(!key.unit) throw new Error("找不到「拜訪單位」欄位，請確認試算表標題列文字");

        visitsBySchool = {};
        allVisitRecords = [];

        json.forEach(row => {
            const unit = String(row[key.unit] || "").trim();

            const record = {
                reporter: key.reporter ? String(row[key.reporter]||"").trim() : "",
                companions: key.companions ? String(row[key.companions]||"").trim() : "",
                unit,
                reason:   key.reason ? String(row[key.reason]||"").trim() : "",
                hasOpp:   key.hasOpp ? String(row[key.hasOpp]||"").trim() : "",
                oppDesc:  key.oppDesc ? String(row[key.oppDesc]||"").trim() : "",
                help:     key.help ? String(row[key.help]||"").trim() : "",
                note:     key.note ? String(row[key.note]||"").trim() : "",
                date:     key.date ? String(row[key.date]||"").trim() : "",
                aiSummary: key.aiSummary ? String(row[key.aiSummary]||"").trim() : "",
                strategy: key.strategy ? String(row[key.strategy]||"").trim() : ""
            };
            // ① 全域累計：不論拜訪單位能否對應到學校卡片，只要有填報人/同行人就計入督導總次數
            if(record.reporter || record.companions) allVisitRecords.push(record);

            // ② 學校卡片：只有能對應到學校的紀錄才放進該校清單
            if(!unit) return;
            const schoolId = matchSchoolId(unit);
            if(!schoolId) return;
            if(!visitsBySchool[schoolId]) visitsBySchool[schoolId]=[];
            visitsBySchool[schoolId].push(record);
        });

        applyStatsToDOM();

        const now = new Date().toLocaleString("zh-TW",{hour12:false});
        statusBar.innerHTML =
            `<span class="status-ok">✔ 已同步 ${json.length} 筆拜訪紀錄（更新於 ${now}）</span>` +
            ` <button onclick="loadVisitData()">重新整理</button>`;

    }catch(err){
        console.error(err);
        statusBar.innerHTML =
            `<span class="status-error">✘ 讀取資料失敗：${err.message}（請確認 Apps Script 已部署為「誰可以存取：所有人」）</span>` +
            ` <button onclick="loadVisitData()">重試</button>`;
    }
}

/* =========================================================
   8. 把統計結果寫回卡片（拜訪次數徽章 + 督導出訪總次數 + 最新拜訪摘要）
   ========================================================= */
/* 「出訪共X次」= 這位督導本人實際出現在拜訪紀錄裡的次數，
   不論是自己填報（填報人姓名）還是以同行拜訪人身分一起去，兩者都算 1 次；
   同一筆紀錄若同時符合兩種身分，也只算 1 次，不重複計算。
   （不限於自己轄區內的學校——同行去別的督導轄區拜訪，一樣算他自己出訪一次） */
function computeSupervisorTotals(){
    const totals = {};
    allVisitRecords.forEach(record => {
        const names = new Set();   // Set：同一筆紀錄同一人只算 1 次
        splitNames(record.reporter).forEach(n => names.add(normalizeName(n)));
        splitNames(record.companions).forEach(n => names.add(normalizeName(n)));
        names.delete("");
        names.forEach(name => {
            totals[name] = (totals[name] || 0) + 1;
        });
    });
    return totals;
}

function applyStatsToDOM(){
    const supervisorTotals = computeSupervisorTotals();

    // 欄位為「無」/空白/未填寫時，該行自動不顯示
    function fieldLine(label, value){
        if(value && value !== "無" && value !== "None"){
            return label + "：" + value + "<br>";
        }
        return "";
    }

    [...SCHOOL_DATA.elementary, ...SCHOOL_DATA.junior].forEach(region=>{
        region.schools.forEach(s=>{
            const badge = document.getElementById("badge_"+s.id);
            const summaryBox = document.getElementById("summary_"+s.id);
            const supEl = document.getElementById("sup_"+s.id);
            const list = visitsBySchool[s.id] || [];

            // 區域督導：姓名 (出訪共X次) —— 出訪次數為該督導名下所有學校的拜訪紀錄總和
            if(supEl){
                supEl.textContent = `區域督導：${s.supervisor} (出訪共${supervisorTotals[normalizeName(s.supervisor)] || 0}次)`;
            }

            if(list.length === 0){
                badge.className = "badge badge-none";
                badge.textContent = "(尚無拜訪紀錄)";
                summaryBox.innerHTML = `<div class="visit-summary"><span class="vs-none-yet">目前尚無拜訪回報紀錄</span></div>`;
                return;
            }

            const latest = list[list.length-1];
            const history = list.slice(-4, -1).reverse();
            const oppCount = list.filter(v => v.hasOpp.includes("有")).length;

            // 徽章：最新拜訪日期 + 拜訪次數 + 機會次數 合併顯示
            const badgeParts = [];
            if(latest.date) badgeParts.push("最新拜訪："+latest.date);
            badgeParts.push("拜訪"+list.length+"次");
            if(oppCount>0) badgeParts.push("機會"+oppCount);
            badge.className = "badge " + (oppCount>0 ? "badge-opportunity" : "badge-visits");
            badge.textContent = "(" + badgeParts.join(" · ") + ")";

            // AI 統整摘要（藍色區塊，放在最新拜訪摘要上方；沒有摘要就不顯示）
            const aiBlock = latest.aiSummary
              ? `<div class="ai-summary"><div class="ai-title">🤖 AI 拜訪總結</div>${latest.aiSummary}</div>`
              : "";

            // 招生策略（綠色區塊）：取該校最近一筆有填「招生策略」欄位的內容
            const stratRec = [...list].reverse().find(v => v.strategy);
            const stratBlock = stratRec
              ? `<div class="strategy-box"><div class="ai-title">🎯 在地化招生策略</div>${stratRec.strategy}</div>`
              : "";

            summaryBox.innerHTML = `
              ${aiBlock}
              ${stratBlock}
              <div class="visit-summary">
                <div class="vs-title">最新拜訪摘要${latest.date ? "（"+latest.date+"）" : ""}</div>
                ${fieldLine("填報人", latest.reporter)}
                是否有招生機會：<span class="${latest.hasOpp.includes("有") ? "vs-opportunity" : ""}">${latest.hasOpp || "-"}</span><br>
                ${fieldLine("機會簡述", latest.oppDesc)}
                ${fieldLine("希望協助", latest.help)}
                ${fieldLine("拜訪記事", latest.note)}
                ${history.length ? `
                  <div class="visit-history">
                    往前 ${history.length} 筆：
                    ${history.map(h => `<div class="vh-item">・${h.date || "(無日期)"} ${h.reporter || ""}：${h.hasOpp || "-"}${h.note ? "／"+h.note : ""}</div>`).join("")}
                  </div>` : ""}
              </div>`;
        });
    });
}

/* =========================================================
   8.5 招生策略提示詞（帶入該校資料，複製後貼到 Claude / ChatGPT / Gemini）
   ========================================================= */
function findSchoolById(id){
    for(const r of [...SCHOOL_DATA.elementary, ...SCHOOL_DATA.junior]){
        const sc = r.schools.find(x => x.id === id);
        if(sc) return {school: sc, region: r.region};
    }
    return null;
}

function buildStrategyPrompt(id){
    const f = findSchoolById(id);
    if(!f) return "";
    const {school:sc, region} = f;
    const list = (visitsBySchool[id] || []).slice(-5);
    const visits = list.length
      ? list.map((v,i) => `${i+1}. ${v.date||"(無日期)"}｜填報人：${v.reporter||"-"}｜招生機會：${v.hasOpp||"-"}\n   機會簡述：${v.oppDesc||"-"}\n   希望協助：${v.help||"-"}\n   拜訪記事：${v.note||"-"}`).join("\n")
      : "（尚無拜訪紀錄）";
    return [
"【角色設定】",
"你是一位擁有 30年經驗的私立高中招生行銷總監與校務發展顧問，擅長分析國中升學市場、區域地緣關係與家長心理，並能制定高轉化率的精準招生策略。",
"",
"【背景脈絡與現況】",
"1. 學校與區域：我們是台中市潭子區的高中，目前正在規劃針對周邊國中及國小家長會的招生宣傳。本次目標學校：" + region + sc.name + "（區域督導：" + sc.supervisor + "；認輔教師：" + sc.teachers + "）。",
"2. 既有資源：區域督導與招生組已初步連結在地仕紳、家長會顧問、在地商家；學校具備特色課程（如特招、技藝班陶藝課程、國中家長說明會、國際雙聯預科課程）。",
"3. 該校最近拜訪紀錄（新→舊最後 5 筆，請以此為事實依據）：",
visits,
"4. 招生目標：提升周邊國中學生對本校特招與特色課程的報名率，並深化在地家長會與仕紳的轉介紹意願。",
"",
"【任務要求】",
"請針對上述背景，為我們制定一套「在地化精準招生策略」，包含以下面向：",
"1. 關鍵突破口分析：如何將「在地仕紳/家長會顧問資源」轉化為實際的學生轉介？",
"2. 差異化文宣與體驗活動建議：針對「技藝班學生」與「學術導向學生（如特招/說明會）」應採取何種不同的溝通策略與活動設計？",
"3. 30 天跟進行動計畫：給招生組工作人員的具體執行步驟（Step-by-step），包含拜訪後的追蹤頻率與溝通切入點。",
"",
"【限制條件】",
"- 請勿提供過於寬泛或空洞的理論（例如「提升學校知名度」、「做好品質」等）。",
"- 策略必須切合台中在地或區域國中升學的實際場景，具備可執行性與落地性。",
"",
"【輸出格式】",
"1. 請先用「核心策略矩陣」呈現（包含：目標對象 | 切入痛點 | 推薦作法 | 預期KPI）。",
"2. 再提供「30 天執行時間軸（分週條列）」。"
    ].join("\n");
}

async function copyStrategyPrompt(id, btn){
    const text = buildStrategyPrompt(id);
    const old = btn.textContent;
    try{
        await navigator.clipboard.writeText(text);
        btn.textContent = "✅ 已複製，請貼到 AI 對話中";
    }catch(e){
        window.prompt("請複製以下提示詞：", text);
    }
    setTimeout(()=>{ btn.textContent = old; }, 2500);
}

/* =========================================================
   9. 搜尋（沿用原邏輯，對象改為 .line-title .name）
   ========================================================= */
function searchName(){
    let k=document.getElementById("searchInput").value.trim();
    let count=0;

    document.querySelectorAll(".highlight").forEach(e=>e.classList.remove("highlight"));
    if(k==="") { document.getElementById("resultCount").innerText=""; return; }

    document.querySelectorAll(".line-title, .teacher").forEach(el=>{
        if(el.innerText.includes(k)){
            el.classList.add("highlight");
            count++;

            let schoolBlock = el.closest(".schools");
            if(schoolBlock) schoolBlock.style.display="block";

            if(el.classList.contains("line-title")){
                let next=el.nextElementSibling;
                if(next && next.classList.contains("teacher")) next.style.display="block";
            }
            if(el.classList.contains("teacher")){
                let school=el.previousElementSibling;
                if(school && school.classList.contains("line-title")) school.classList.add("highlight");
            }
        }
    });

    document.getElementById("resultCount").innerText = "找到 "+count+" 筆";
}

function clearSearch(){
    document.getElementById("searchInput").value="";
    document.getElementById("resultCount").innerText="";
    document.querySelectorAll(".highlight").forEach(e=>e.classList.remove("highlight"));
    document.querySelectorAll(".schools").forEach(e=>e.style.display="none");
    document.querySelectorAll(".teacher").forEach(e=>e.style.display="none");
}

renderGrid("grid-elementary", SCHOOL_DATA.elementary);
renderGrid("grid-junior", SCHOOL_DATA.junior);
loadVisitData();

document.getElementById("searchInput").addEventListener("keydown", function(e){
    if(e.key === "Enter") searchName();
});
